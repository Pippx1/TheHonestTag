.ht-bar-wrap{margin-top:.75rem;padding-bottom:8px}
.ht-bar{position:relative;display:flex;height:16px;border-radius:999px;background:#F3F4F6;cursor:pointer;touch-action:manipulation}
.ht-bar::before{content:"";position:absolute;left:0;right:0;top:-9px;bottom:-9px}
.ht-bseg{position:relative;flex:0 1 auto;min-width:3px;height:100%;margin:0;padding:0;border:0;cursor:pointer;transition:width .5s,opacity .2s}
.ht-bseg+.ht-bseg{margin-left:2px}
.ht-bseg:first-child{border-radius:999px 0 0 999px}
.ht-bseg:last-child{border-radius:0 999px 999px 0}
.ht-bseg:only-child{border-radius:999px}
.ht-bseg:focus-visible{outline:2px solid #14181F;outline-offset:2px;z-index:2}
.ht-bseg[aria-pressed=true]{transform:scaleY(1.5);z-index:1;box-shadow:0 0 0 1.5px #FFFDF6}
.ht-bseg[aria-pressed=true]::after{content:"";position:absolute;left:50%;top:100%;margin-top:2px;transform:translateX(-50%) scaleY(.67);border:5px solid transparent;border-top:0;border-bottom-color:currentColor}
.ht-key{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 4px;margin-top:2rem}
.ht-key-i{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:12px;line-height:1.2;color:#6B7280;background:transparent;border:1px solid transparent;border-radius:999px;padding:4px 9px;cursor:pointer}
.ht-key-i:hover,.ht-key-i.on{background:#fff;border-color:#DDD8C9;color:#14181F}
.ht-key-i:focus-visible{outline:2px solid #14181F;outline-offset:1px}
.ht-dot{width:8px;height:8px;border-radius:999px;flex:none;display:inline-block}
.ht-stage-card{margin-top:.6rem;border:1px solid #E6E1D2;border-radius:10px;background:#fff;padding:10px 12px;font-size:12px;line-height:1.5;color:#374151;min-height:8.6rem;display:flex;flex-direction:column;justify-content:center}
.ht-stage-hint{margin:0;color:#6B7280;text-align:center}
.ht-stage-h{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:#111827;margin-bottom:4px}
.ht-stage-row{display:flex;gap:8px;align-items:baseline}
.ht-stage-c{flex:1;min-width:0}
.ht-stage-k{flex:none;width:3.6rem;color:#6B7280}
.ht-stage-row b{color:#111827;font-variant-numeric:tabular-nums}
.ht-stage-p{color:#6B7280}
.ht-stage-d{margin:6px 0 0;color:#4B5563}
.ht-stage-v{display:inline-block;margin-right:6px;padding:0 6px;border-radius:6px;background:#F3F1E8;color:#111827;font-weight:600}
@media print{.ht-key-i{border:0;padding:0 6px}.ht-bseg{opacity:1!important}.ht-bseg::after{display:none}}

.dd-hint{margin:2rem 0 0;font-size:12.5px;color:#6B7280}
.dd-rowx{scroll-margin-top:90px}
.dd-rowx-h{cursor:pointer;position:relative;transition:background .15s}
.dd-rowx-h:hover{background:#F7F6F0}
.dd-rowx.on>.dd-rowx-h{background:#F3F1E8}
.dd-rowx-h:focus-visible{outline:2px solid #2F4B63;outline-offset:-2px}
.dd-rowx-h:hover .ht-pipe-open,.dd-rowx-h:focus-visible .ht-pipe-open,.dd-rowx.on .ht-pipe-open{opacity:1}
@media(hover:none){.dd-rowx-h .ht-pipe-open{opacity:.9}}
.dd-rowx-d{border-top:1px solid #E5E3D8;background:#FBFAF6;padding:6px 0}
.ht-drill-in{margin:0;border:0;border-radius:0;background:transparent}
.dd-det{padding:12px 20px 14px;display:flex;flex-direction:column;gap:12px}
.dd-det-p{margin:0;font-size:13px;font-weight:700;color:#14181F}
.dd-det-k{margin:0;font-size:12.5px;line-height:1.5;color:#4B5563}
.dd-det-k b{color:#14181F}
.dd-det-n{margin:0;font-size:11.5px;color:#6B7280}
.dd-formula{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 8px}
.dd-term{display:flex;flex-direction:column;gap:2px;padding:6px 10px;border:1px solid #E1DDCF;border-radius:8px;background:#fff;min-width:0}
.dd-term b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;font-weight:700;color:#111827;font-variant-numeric:tabular-nums}
.dd-term span{font-size:10.5px;color:#6B7280}
.dd-op{align-self:center;color:#6B7280;font-weight:700}
.dd-det-link{align-self:flex-start;font:inherit;font-size:12px;font-weight:700;color:#2F4B63;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.dd-rib-bar button{display:block;flex:0 1 auto;min-width:3px;height:100%;margin:0;padding:0;border:0;cursor:pointer;transition:opacity .2s}
.dd-rib-bar button:focus-visible{outline:2px solid #14181F;outline-offset:-3px}
.dd-rib-leg button{display:grid;grid-template-columns:10px 1fr;column-gap:8px;align-items:center;text-align:left;font:inherit;color:inherit;background:none;border:0;padding:4px 6px;margin:-4px -6px;border-radius:8px;cursor:pointer}
.dd-rib-leg button:hover,.dd-rib-leg button.on{background:#F3F1E8}
.dd-rib-leg button:focus-visible{outline:2px solid #14181F;outline-offset:1px}
@media print{.dd-hint,.ht-pipe-open{display:none}}
